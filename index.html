<style>
:root{
  --bg:#F4F7FB; --surface:#FFFFFF; --ink:#0E1C2E; --muted:#4D5F76; --line:#D4DEEA;
  --accent:#1E5A86; --pop:#3B8FE0;
  --band:#0E2B4F; --band-ink:#F2F7FC; --band-muted:#B6C9DF; --band-line:#2B4D75; --eyebrow:#8CC6F5;
  --font-ui:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--surface);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
a{color:inherit}
.wrap{width:100%;max-width:1560px;margin:0 auto;padding-left:max(clamp(16px,4.5vw,72px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4.5vw,72px),env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;min-height:66px;max-width:none;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.logo{display:inline-flex;align-items:center;line-height:0;text-decoration:none}
.logo svg{height:24px;width:auto}
main{flex:1;display:flex;align-items:center;position:relative;overflow:hidden;background:var(--band);color:var(--band-ink)}
.ring{position:absolute;right:-180px;top:50%;transform:translateY(-50%);width:640px;height:640px;pointer-events:none}
.ring circle{stroke:#8CC6F5;stroke-opacity:.06}
.dots{position:absolute;right:0;top:0;height:100%;width:min(46%,700px);pointer-events:none;-webkit-mask-image:linear-gradient(to right,transparent,#000 38%);mask-image:linear-gradient(to right,transparent,#000 38%)}
.dots .f{transform-box:fill-box;transform-origin:center;animation:fl 5.5s ease-in-out infinite}
.dots .hi{animation:tw 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.82);opacity:.55}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dots .hi,.dots .f{animation:none}}
@media (max-width:760px){.dots{width:100%;opacity:.5;-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.45),rgba(0,0,0,.6) 40%,#000 80%);mask-image:linear-gradient(to bottom,rgba(0,0,0,.45),rgba(0,0,0,.6) 40%,#000 80%)}}
.hero{position:relative;padding:56px 0 72px;max-width:720px}
.eyebrow{font-family:var(--font-data);font-size:12px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--eyebrow)}
h1{font-size:clamp(36px,5.2vw,60px);line-height:1.04;letter-spacing:-.03em;font-weight:700;margin:16px 0 20px;text-wrap:balance}
.lede{font-size:18px;line-height:1.6;color:var(--band-muted);margin:0;max-width:58ch}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 22px;border-radius:9px;font-weight:600;font-size:15px;line-height:1.5;text-decoration:none;border:1px solid transparent;transition:filter .15s,background .15s}
.btn.primary{background:var(--pop);border-color:var(--pop);color:#FFFFFF}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--band-ink);border-color:var(--band-line)}
.btn.ghost:hover{background:rgba(255,255,255,.08)}
.btn:focus-visible{outline:3px solid var(--eyebrow);outline-offset:2px}
.segs{display:none;flex-direction:column;gap:7px;list-style:none;margin:8px 0 0;padding:0}
.segs-eb{display:none;margin-top:28px;font-size:11px}
.segs li{display:flex;gap:10px;align-items:center;background:rgba(14,43,79,.55);border:1px solid var(--band-line);border-radius:12px;padding:8px 12px;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.seg-ic{flex:none;width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:rgba(140,198,245,.12);color:var(--eyebrow)}
.segs b{display:block;font-size:14px;font-weight:600;color:var(--band-ink)}
.segs span:not(.seg-ic){display:block;font-size:14px;line-height:1.45;color:var(--band-muted);margin-top:2px}
footer{border-top:1px solid var(--line);padding-block:28px 32px;font-size:13px;color:var(--muted);background:var(--surface)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--ink)}
@media (max-width:760px){
  header .wrap{padding-left:16px;padding-right:16px;min-height:60px}
  .logo svg{height:21px}
  .ring{width:360px;height:360px;right:-170px;top:24%}
  main{align-items:stretch}
  main>.wrap{display:flex}
  .hero{display:flex;flex-direction:column;flex:1;padding:clamp(44px,9dvh,96px) 0 clamp(28px,5dvh,56px)}
  h1{margin:14px 0 18px}
  .cta{margin-top:28px}
  .segs{display:flex}
  .segs-eb{display:block;margin-top:auto;padding-top:40px}
  .btn{flex:1 1 100%}
}
</style>
</head>
