<style>
:root{
  --bg:#F4F7FB; --surface:#FFFFFF; --ink:#0E1C2E; --muted:#4D5F76; --line:#D4DEEA;
  --accent:#1E5A86; --accent-ink:#163F5E; --navy:#0E2B4F; --pop:#3B8FE0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.55;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
a{color:inherit}
.wrap{width:100%;padding:0 clamp(24px,3.5vw,56px)}
header{padding:32px 0}
.logo{display:inline-block;line-height:0}
.logo svg{height:30px;width:auto}
main{flex:1;display:flex;align-items:center;position:relative;overflow:hidden}
.ring{position:absolute;right:-180px;top:50%;transform:translateY(-50%);width:640px;height:640px;pointer-events:none}
.hero{position:relative;padding:48px 0 88px;max-width:700px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.eyebrow::before{content:"";width:9px;height:9px;border-radius:50%;border:2.5px solid var(--accent)}
h1{font-size:clamp(38px,6vw,62px);line-height:1.04;letter-spacing:-.025em;font-weight:700;margin:18px 0 22px}
.lede{font-size:clamp(17px,2vw,20px);color:var(--muted);margin:0 0 34px;max-width:54ch}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:10px;font-weight:600;font-size:16px;text-decoration:none;border:1.5px solid transparent;transition:background .15s,border-color .15s}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:var(--navy)}
.btn.ghost{border-color:var(--line);background:var(--surface);color:var(--ink)}
.btn.ghost:hover{border-color:var(--accent)}
.btn:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.facts{list-style:none;padding:0;margin:56px 0 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;border-top:1px solid var(--line);padding-top:28px}
.facts b{display:block;font-size:15px;margin-bottom:4px}
.facts span{font-size:14px;color:var(--muted);line-height:1.5}
footer{padding:28px 0 36px;font-size:13px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (max-width:760px){
  .wrap{padding:0 16px}
  header{padding:22px 0}
  .logo svg{height:24px}
  .ring{width:360px;height:360px;right:-170px;top:24%}
  .hero{padding:24px 0 56px}
  .facts{grid-template-columns:minmax(0,1fr);gap:18px;margin-top:44px}
  .btn{flex:1 1 100%}
}
</style>
</head>
