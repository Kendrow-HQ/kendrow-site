<style>
:root{
  --bg:#F9F8F5; --surface:#FFFFFF; --ink:#0A1628; --muted:#50545C; --faint:#767980; --line:#E5E2DB; --line2:#D0CCC3;
  --accent:#B4583A; --gold:#B8893E; --bad:#A6263E;
  --sans:"Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --wrap:1560px; color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(clamp(20px,4.9vw,72px), env(safe-area-inset-left,0px));padding-right:max(clamp(18px,3.2vw,50px), env(safe-area-inset-right,0px))}
.page{min-height:100vh;min-height:100svh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
header{position:relative;z-index:2}
header .wrap{display:flex;align-items:center;height:70px}
.wm{height:26px;width:auto;display:block}
.hero{position:relative;display:flex;align-items:center;padding-block:clamp(18px,3vh,44px) clamp(24px,4vh,56px)}
.hero > .wrap{width:100%}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(32px,5vw,72px);align-items:center}
.hero-copy{display:grid;gap:26px;justify-items:start;min-width:0;position:relative;z-index:1}
.soon{display:inline-flex;align-items:center;gap:9px;font-size:14px;font-weight:500;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:6px 14px 6px 12px;background:rgba(255,255,255,.6)}
.soon i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(180,88,58,.45)}70%,100%{box-shadow:0 0 0 8px rgba(180,88,58,0)}}
h1{font-size:clamp(46px,6.9vw,108px);letter-spacing:-.05em;line-height:.96;font-weight:500}
h1 span{display:block}
h1 .q{position:relative;width:max-content;max-width:100%}
h1 .q em{display:block;font-family:"Instrument Serif","Iowan Old Style",Georgia,serif;font-style:italic;font-weight:400;font-size:1.2em;letter-spacing:-.025em;line-height:.92;padding:0 .08em .06em 0}
.hero-thr{position:absolute;left:-1%;bottom:-.17em;width:150%;height:.36em;overflow:visible;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,#000 55%,transparent 100%);mask-image:linear-gradient(90deg,#000 55%,transparent 100%)}
.hero-thr path{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:0;animation:thrDraw 1.5s cubic-bezier(.5,0,.2,1) .55s both}
.hero-thr .t1{stroke:#B4583A;stroke-width:1.6}
.hero-thr .t2{stroke:#B8893E;stroke-width:1.3;animation-delay:.7s}
.hero-thr .t3{stroke:var(--ink);stroke-width:1.1;opacity:.45;animation-delay:.85s}
@keyframes thrDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.lede{font-size:clamp(18px,1.6vw,22px);letter-spacing:-.012em;line-height:1.45;color:var(--muted);margin-top:6px;max-width:60ch}
.join{display:grid;gap:8px;width:100%;max-width:470px;margin-top:6px}
.signup{display:flex;align-items:center;gap:6px;padding:6px;border:1px solid var(--line2);border-radius:999px;background:var(--surface);box-shadow:0 1px 2px rgba(24,20,12,.05),0 18px 34px -22px rgba(24,20,12,.35);transition:border-color .15s,box-shadow .15s}
.signup:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(180,88,58,.16)}
.signup.err{border-color:var(--bad)}
.signup input{flex:1;min-width:0;height:46px;border:0;background:none;padding:0 6px 0 18px;font:inherit;font-size:16px;color:var(--ink);outline:none}
.signup input::placeholder{color:var(--faint)}
.signup button{flex:none;height:46px;padding:0 22px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font:inherit;font-weight:600;font-size:15.5px;letter-spacing:-.01em;cursor:pointer;white-space:nowrap;transition:opacity .15s,transform .15s}
.signup button:hover{opacity:.88}
.signup button:active{transform:scale(.98)}
.signup button:focus-visible,footer a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.form-msg{min-height:20px;padding-left:18px;font-size:13.5px;color:var(--muted)}
.form-msg.err{color:var(--bad)}
.form-msg a{color:inherit}
/* the cover: fine threads drawn into one woven ring */
.kw{position:relative;justify-self:center;width:min(126%,calc((100svh - 150px)*1.14));min-width:min(100%,440px);aspect-ratio:1/.96;margin:-9% -14% -9% -8%}
.kw::before{content:"";position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle at 42% 40%,rgba(246,214,180,.85),rgba(246,214,180,0) 62%),radial-gradient(circle at 66% 64%,rgba(232,201,140,.5),rgba(232,201,140,0) 58%),radial-gradient(circle at 34% 72%,rgba(226,214,196,.55),rgba(226,214,196,0) 55%);filter:blur(22px)}
.kw canvas{position:absolute;inset:0;width:100%;height:100%;-webkit-mask-image:radial-gradient(closest-side,#000 70%,transparent 100%);mask-image:radial-gradient(closest-side,#000 70%,transparent 100%)}
.kw-hub{position:absolute;left:50%;top:50%;width:17%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,247,236,.82),rgba(255,247,236,.5) 58%,rgba(255,247,236,0) 100%);display:grid;place-items:center}
.kw-hub svg{width:84%;height:84%}
.kw-hub.beat{animation:kwBeat .9s cubic-bezier(.2,.8,.2,1)}
@keyframes kwBeat{0%{scale:1;box-shadow:0 0 0 0 rgba(180,88,58,.26)}35%{scale:1.07}100%{scale:1;box-shadow:0 0 0 30px rgba(180,88,58,0)}}
footer{position:relative;z-index:2;border-top:1px solid var(--line);font-size:13.5px;color:var(--faint)}
.ftr{display:flex;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding-block:22px}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--ink)}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.rise.d1{animation-delay:.08s}.rise.d2{animation-delay:.16s}.rise.d3{animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (max-width:940px){
  .hero{align-items:start;padding-top:clamp(20px,5vw,44px)}
  .hero-grid{grid-template-columns:minmax(0,1fr);gap:8px}
  .kw{width:min(100%,560px);min-width:0;margin:-2% auto -4%}
}
@media (max-width:520px){
  .join{max-width:none}
  .signup{flex-direction:column;align-items:stretch;gap:10px;padding:0;border:0;background:none;box-shadow:none}
  .signup:focus-within{box-shadow:none}
  .signup input{flex:none;height:54px;padding:0 20px;border:1px solid var(--line2);border-radius:999px;background:var(--surface);box-shadow:0 1px 2px rgba(24,20,12,.05);transition:border-color .15s,box-shadow .15s}
  .signup input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(180,88,58,.16)}
  .signup.err input{border-color:var(--bad)}
  .signup button{height:54px;font-size:16px}
  .form-msg{padding-left:2px}
}
@media (prefers-reduced-motion: reduce){ .soon i,.rise,.hero-thr path{animation:none} }
</style>
</head>

<script>
(function(){
  // No sign-up service is connected yet, so the form opens a pre-filled email to hello@kendrow.com.
  var form = document.getElementById('signup'), input = document.getElementById('email'), msg = document.getElementById('formMsg');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var v = input.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){
      form.classList.add('err'); msg.className = 'form-msg err'; msg.textContent = 'Enter a valid email address.'; input.focus(); return;
    }

/* The cover animation. */
function weaveInit(root) {

    { a: -2.72 + 2 * TAU / 3, cols: ['#B8893E', '#D2AC62', '#8A6A3F', '#E0C48A'] } ];

  const ss = (a, b, x) => { x = Math.min(1, Math.max(0, (x - a) / (b - a))); return x * x * (3 - 2 * x); };

    const box = root.closest('.hero'), hb = box ? box.getBoundingClientRect() : r0, hd = document.getElementById('hdr'), loY = Math.max(0, hb.top - r0.top) + 26 + (hd ? Math.max(0, hd.offsetHeight - (hb.top + scrollY)) : 0), hiY = Math.min(H, hb.bottom - r0.top) - 26;
    labs.forEach((el, k) => { const u = .46, th = ARMS[k].a + SWEEP * u, r = R + (RO - R) * Math.pow(1 - u, 1.85) + (band + (wout - band) * Math.pow(1 - u, 1.15)) * .5 + 22; const hw = el.offsetWidth / 2 + 6, lo = Math.max(0, 12 - r0.left) + hw, hi = Math.min(W, document.documentElement.clientWidth - 12 - r0.left) - hw; el.style.left = Math.max(lo, Math.min(hi, cx + r * Math.cos(th))) + 'px'; el.style.top = Math.max(loY, Math.min(hiY, cy + r * Math.sin(th))) + 'px'; });
  }

    });

    for (let g = 0; g < 14; g++) { const st = strands[(g * 11 + 3) % strands.length], v = ((t * (.07 + (g % 5) * .012) + g * .37) % 2.1) - .05, len = .07; if (v > grow) continue;
      ctx.beginPath(); for (let i = 0; i <= 10; i++) { const p = along(st, Math.max(0, Math.min(2, v + len * i / 10)), t); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }
      ctx.globalAlpha = .75; ctx.lineWidth = 1.5; ctx.strokeStyle = st.col; ctx.stroke(); }
    ctx.globalAlpha = 1;

    ctx.restore();
    if (!RMO) raf = requestAnimationFrame(frame);
  }
  const start = () => { if (!raf && on) raf = requestAnimationFrame(frame); };
  size();
  new ResizeObserver(() => { size(); if (RMO) { on = true; frame(performance.now()); } }).observe(root);
  if ('IntersectionObserver' in window) new IntersectionObserver(es => { on = es.some(e => e.isIntersecting) && !document.hidden; start(); }, { threshold: .05 }).observe(root); else { on = true; start(); }
  document.addEventListener('visibilitychange', () => { on = !document.hidden; start(); });
  if (!RMO) root.closest('section, body').addEventListener('pointermove', e => { const r = root.getBoundingClientRect(); tx = ((e.clientX - r.left) / r.width - .5) * -10; ty = ((e.clientY - r.top) / r.height - .5) * -10; });

  const again = () => { size(); if (RMO) { on = true; frame(performance.now()); } };
  addEventListener('resize', again); addEventListener('load', again); setTimeout(again, 1000); if (document.fonts && document.fonts.ready) document.fonts.ready.then(again);
}
weaveInit(document.getElementById('kw'));
